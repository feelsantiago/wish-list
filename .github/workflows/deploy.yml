name: Deploy

# Points one Railway environment's API service at an exact image tag and
# deploys it (ADR-0047). Called by ci.yml: today `main` → staging; later pull
# requests → staging and `main` → production. Railway runs `node migrate.js`
# as the pre-deploy command and moves traffic only once /api/health is 2xx.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment and Railway environment name
        required: true
        type: string
      image:
        description: Full image reference, always a sha-<short> tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Holds RAILWAY_API_TOKEN (secret: an account token), RAILWAY_PROJECT_ID
    # and RAILWAY_SERVICE (variables). A project token finds the service but is
    # refused when changing its image source.
    environment: ${{ inputs.environment }}
    # One deploy per environment at a time; a newer run replaces a waiting one.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      RAILWAY_ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ inputs.image }}
    steps:
      # An empty value makes the CLI answer "Unauthorized", which misleads.
      - name: Check the environment's Railway settings
        run: |
          missing=()
          [ -n "$RAILWAY_API_TOKEN" ] || missing+=("secret RAILWAY_API_TOKEN")
          [ -n "$RAILWAY_PROJECT" ] || missing+=("variable RAILWAY_PROJECT_ID")
          [ -n "$RAILWAY_SERVICE" ] || missing+=("variable RAILWAY_SERVICE")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::GitHub Environment "%s" is missing: %s\n' \
              "$RAILWAY_ENVIRONMENT" "${missing[*]}"
            exit 1
          fi

      - run: npm install --global @railway/cli@5.75.0

      - name: Point the service at the image
        run: >-
          railway service source connect
          --image "$IMAGE"
          --service "$RAILWAY_SERVICE"
          --environment "$RAILWAY_ENVIRONMENT"
          --project "$RAILWAY_PROJECT"

      - name: Deploy the image
        run: >-
          railway service redeploy --from-source --yes
          --service "$RAILWAY_SERVICE"
          --environment "$RAILWAY_ENVIRONMENT"
          --project "$RAILWAY_PROJECT"
