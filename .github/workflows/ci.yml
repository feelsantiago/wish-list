name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same pull request cancels the older run. Runs on main
# always finish: the image and deploy jobs (M0 7c/7d) will run from them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # nrwl/nx-set-shas reads previous workflow runs to find the last green commit.
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sets NX_BASE / NX_HEAD: the merge base for pull requests, the last
      # green commit on main for pushes.
      - uses: nrwl/nx-set-shas@v4

      # Restores the newest cache for this lockfile; saves a new one per commit.
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npx nx format:check --all

      - run: npx nx affected -t lint typecheck test build
