name: CI

on:
  pull_request:
    # closed: put staging back on production's image (ADR-0048).
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

# A newer push to the same pull request cancels the older run. Runs on main
# always finish: production deploys (M0 8c) will run from them. Pull request
# runs are grouped by number, not ref: a merged pull request's `closed` run
# has github.ref = refs/heads/main, and grouping by ref let it cancel the
# push run on main that the merge started.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # nrwl/nx-set-shas reads previous workflow runs to find the last green commit.
  actions: read

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sets NX_BASE / NX_HEAD: the merge base for pull requests, the last
      # green commit on main for pushes.
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check --all

      - run: npx nx affected -t lint typecheck test build

  # Builds the pull request's head commit, the artifact staging tests and
  # production later promotes (ADR-0046, ADR-0048). The head commit, not
  # GitHub's merge preview: promotion looks images up by the head sha. Pull
  # requests from forks get no package write access or secrets, so they skip
  # this and deploys.
  image:
    needs: check
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
      extra-tag: pr-${{ github.event.pull_request.number }}

  # Required to merge: the image deployed, migrated and passed /api/health.
  deploy-staging:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.ref }}
    secrets: inherit

  # A pull request closed without merging: staging goes back to what
  # production runs, its last successful deployment (which may differ from
  # its configured image). A merged one needs nothing: staging already runs
  # its head image, the one production is being given at the same moment, and
  # reading production now would race that deploy and find the old image.
  production-image:
    if: >-
      github.event.action == 'closed'
      && !github.event.pull_request.merged
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Read-only use of the staging environment's Railway account token.
    environment: staging
    outputs:
      ref: ${{ steps.find.outputs.ref }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
    steps:
      - run: npm install --global @railway/cli@5.75.0

      - id: find
        run: |
          ref=$(railway deployment list --json --limit 20 \
              --project "$RAILWAY_PROJECT" --environment production \
              --service "$RAILWAY_SERVICE" \
            | jq -r '[.[] | select(.status == "SUCCESS")] | sort_by(.createdAt) | last | .meta.image // empty')
          if [ -z "$ref" ]; then
            echo "::notice::Production has no successful deployment yet; staging stays as it is."
          else
            echo "Production runs $ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  restore-staging:
    needs: production-image
    if: needs.production-image.outputs.ref != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.production-image.outputs.ref }}
    secrets: inherit

  # Push to main: production runs the image staging tested, the merged pull
  # request's head commit, with no rebuild (ADR-0048). A push with no pull
  # request (an admin bypass) has no tested image and builds one instead.
  promote:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.find.outputs.ref }}
      build: ${{ steps.find.outputs.build }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/wish-list-api"
          head=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | first | .head.sha // empty')
          if [ -z "$head" ]; then
            echo "::warning::$GITHUB_SHA has no merged pull request; building and deploying an image staging never tested."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="$image:sha-${head::7}"
          # Required checks should make this impossible; fail loudly if not.
          if ! docker buildx imagetools inspect "$ref" > /dev/null; then
            echo "::error::$ref, the pull request's tested image, is not in GHCR"
            exit 1
          fi
          echo "Promoting $ref (pull request head $head)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "build=false" >> "$GITHUB_OUTPUT"

  image-main:
    needs: promote
    if: needs.promote.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      sha: ${{ github.sha }}

  # The GitHub Environment `production` only accepts runs from main.
  deploy-production:
    needs: [promote, image-main]
    if: >-
      !cancelled()
      && needs.promote.result == 'success'
      && needs.image-main.result != 'failure'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.image-main.outputs.ref || needs.promote.outputs.ref }}
    secrets: inherit

  # `main` always names what production runs; retagging copies no layers.
  tag-main:
    needs: [promote, image-main, deploy-production]
    if: >-
      !cancelled()
      && needs.deploy-production.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - env:
          REF: ${{ needs.image-main.outputs.ref || needs.promote.outputs.ref }}
        run: docker buildx imagetools create --tag "${REF%:*}:main" "$REF"
