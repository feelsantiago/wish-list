name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same pull request cancels the older run. Runs on main
# always finish: the image and deploy jobs (M0 7c/7d) will run from them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # nrwl/nx-set-shas reads previous workflow runs to find the last green commit.
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sets NX_BASE / NX_HEAD: the merge base for pull requests, the last
      # green commit on main for pushes.
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check --all

      - run: npx nx affected -t lint typecheck test build

  # Builds and pushes the API image on main only, after check (ADR-0046).
  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The image's build context: bundle, pruned lockfile, workspace_modules.
      - run: npx nx run api:prune

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<short> never moves and is what deploys use; main follows the branch.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wish-list-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - uses: docker/build-push-action@v6
        with:
          context: apps/api/dist
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
