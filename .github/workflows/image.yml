name: Image

# Builds the API image from one commit and pushes it to GHCR (ADR-0046).
# Called by ci.yml for a pull request's head commit, and for a push to main
# that has no pull request to promote (ADR-0048). The caller grants
# `packages: write`.
on:
  workflow_call:
    inputs:
      sha:
        description: Commit to build; tagged sha-<first 7 characters>
        required: true
        type: string
      extra-tag:
        description: Additional moving tag, e.g. pr-12 (optional)
        required: false
        type: string
        default: ''
    outputs:
      ref:
        description: The immutable sha-<short> reference deploys use
        value: ${{ jobs.build.outputs.ref }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.tags.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The image's build context: bundle, pruned lockfile, workspace_modules.
      - run: npx nx run api:prune

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<short> never moves and is what deploys and promotion use.
      - id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ inputs.sha }}
          EXTRA_TAG: ${{ inputs.extra-tag }}
        run: |
          image="ghcr.io/${OWNER,,}/wish-list-api"
          ref="$image:sha-${SHA::7}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$ref"
            if [ -n "$EXTRA_TAG" ]; then echo "$image:$EXTRA_TAG"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # OCI labels only (source repository, revision); tags come from above.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wish-list-api

      - uses: docker/build-push-action@v6
        with:
          context: apps/api/dist
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
